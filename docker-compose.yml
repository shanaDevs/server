  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-AllPos145}
      - MYSQL_DATABASE=${DB_NAME:-premius_distributors}
      - MYSQL_USER=${DB_USER:-root}
      - MYSQL_PASSWORD=${DB_PASSWORD:-AllPos145}
    ports:
      - "${DB_PORT:-3380}:3380"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
